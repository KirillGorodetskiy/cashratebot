services:
  app:
    build: .
    container_name: my_bot_app
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  redis:
    image: redis:7
    container_name: redis_container
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
